plugins {
    id 'com.android.application'
}

android {
    namespace 'org.nobody.multitts'
    compileSdk 35

    defaultConfig {
        applicationId "org.nobody.multitts.cloud"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 全部使用 compileOnly：只编译 org.nobody.multitts.cloud.*，不把重复的 androidx/material 类和错误 R ID 打进 DEX
    compileOnly 'androidx.appcompat:appcompat:1.7.0'
    compileOnly 'com.google.android.material:material:1.12.0'
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
}
